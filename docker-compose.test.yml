services:
  postgres:
    environment:
      POSTGRES_DB: super_admin_test
      POSTGRES_USER: super_admin_test
      POSTGRES_PASSWORD: test-postgres-password
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    ports: !reset []
    healthcheck:
      interval: 1s
      timeout: 1s
      retries: 20
      start_period: 1s

  redis:
    volumes: !reset []
    tmpfs:
      - /data
    ports: !reset []
    healthcheck:
      interval: 1s
      timeout: 1s
      retries: 20

  minio:
    environment:
      MINIO_ROOT_USER: test-minio-access-key
      MINIO_ROOT_PASSWORD: test-minio-secret-key
    volumes: !reset []
    tmpfs:
      - /data
    ports: !reset []
    healthcheck:
      interval: 1s
      timeout: 1s
      retries: 20
      start_period: 1s

  minio-init:
    environment:
      MINIO_ROOT_USER: test-minio-access-key
      MINIO_ROOT_PASSWORD: test-minio-secret-key
      OBJECT_STORAGE_BUCKET: learning-assistant-test
      OBJECT_STORAGE_ACCESS_KEY: test-app-access-key
      OBJECT_STORAGE_SECRET_KEY: test-app-secret-key

  mailpit:
    ports: !reset []
    healthcheck:
      interval: 1s
      timeout: 1s
      retries: 20

  server:
    environment:
      DATABASE_URL: postgresql://super_admin_test:test-postgres-password@postgres:5432/super_admin_test?schema=public
      JWT_ACCESS_SECRET: test-jwt-access-secret-at-least-32-characters
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: learning-assistant-test
      OBJECT_STORAGE_ACCESS_KEY: test-app-access-key
      OBJECT_STORAGE_SECRET_KEY: test-app-secret-key
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: noreply@example.test
      APP_PUBLIC_URL: http://client.test
    ports: !reset []
    healthcheck:
      interval: 2s
      timeout: 1s
      retries: 20
      start_period: 2s

  client:
    ports: !override
      - '127.0.0.1:${TEST_CLIENT_PORT:-18080}:80'
    healthcheck:
      interval: 2s
      timeout: 1s
      retries: 10
